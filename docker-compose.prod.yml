# Stack de production du site (VPS OVHcloud unique, cf. ADR-0016 et ADR-0030).
#
# Ne contient plus que l'application : PostgreSQL et Caddy ont été extraits dans
# un socle partagé (~/infra sur le VPS), car ils servent aussi Keycloak et les
# futures applications de la machine — cf.
# docs/architecture/decisions/0030-socle-vps-partage.md.
#
# Toutes les valeurs sensibles viennent de variables d'environnement, fournies par
# un fichier ".env" à la racine (jamais commité, cf. .env.example).

services:
  app:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # "db" est résolu via le réseau partagé "socle" : Compose publie le nom du
      # service comme alias réseau, y compris entre projets différents.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STOCKAGE_IMAGES_CHEMIN: /data/images
      LOG_PATH: /data/logs
      APP_URL_BASE: ${APP_URL_BASE}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_EXPEDITEUR_EMAIL: ${BREVO_EXPEDITEUR_EMAIL}
      BREVO_EXPEDITEUR_NOM: ${BREVO_EXPEDITEUR_NOM}
      BREVO_LISTE_ID: ${BREVO_LISTE_ID}
      CONTACT_EMAIL_AUTEUR: ${CONTACT_EMAIL_AUTEUR}
      CONTACT_SMTP_HOST: ${CONTACT_SMTP_HOST}
      CONTACT_SMTP_PORT: ${CONTACT_SMTP_PORT}
      CONTACT_SMTP_USERNAME: ${CONTACT_SMTP_USERNAME}
      CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD}
      CONTACT_SMTP_EXPEDITEUR_EMAIL: ${CONTACT_SMTP_EXPEDITEUR_EMAIL}
      CONTACT_SMTP_EXPEDITEUR_NOM: ${CONTACT_SMTP_EXPEDITEUR_NOM}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
    volumes:
      - ../volumes/images-data:/data/images
      - ../volumes/logs-data:/data/logs
    expose:
      - "8080"
    # Pas de "ports" publié : seul Caddy (dans ~/infra) écoute en 80/443 et
    # atteint ce service via "app:8080" sur le réseau partagé.
    #
    # Pas de "depends_on" sur la base : elle vit dans un autre projet Compose, où
    # cette clé n'a pas de portée. Au démarrage de la machine, l'application peut
    # donc redémarrer une ou deux fois avant que PostgreSQL réponde — c'est le
    # rôle de "restart: unless-stopped" d'absorber ce cas.
    networks:
      - socle

# Réseau partagé avec le socle (~/infra) et Keycloak (~/keycloak). Créé une seule
# fois sur le VPS : "docker network create socle".
networks:
  socle:
    external: true
