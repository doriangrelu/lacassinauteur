services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/site
      SPRING_DATASOURCE_USERNAME: site
      SPRING_DATASOURCE_PASSWORD: site
      STOCKAGE_IMAGES_CHEMIN: /data/images
    volumes:
      - images-data:/data/images
    ports:
      - "8080:8080"

volumes:
  db-data:
  images-data:
