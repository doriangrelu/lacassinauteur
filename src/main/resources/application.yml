spring:
  application:
    name: site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/site}
    username: ${SPRING_DATASOURCE_USERNAME:site}
    password: ${SPRING_DATASOURCE_PASSWORD:site}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  stockage:
    images:
      chemin: ${STOCKAGE_IMAGES_CHEMIN:./data/images}
      prefixe-url: /media

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
