spring:
  application:
    name: site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/site}
    username: ${SPRING_DATASOURCE_USERNAME:site}
    password: ${SPRING_DATASOURCE_PASSWORD:site}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  stockage:
    images:
      chemin: ${STOCKAGE_IMAGES_CHEMIN:./data/images}
      prefixe-url: /media
  newsletter:
    # Base des liens absolus (confirmation/désinscription) insérés dans les emails
    # transactionnels — un email n'a pas de "current origin" comme un navigateur.
    url-base: ${APP_URL_BASE:http://localhost:8080}
    brevo:
      # Cf. ADR-0002 / ADR-0013 : jamais commitée, à fournir en variable
      # d'environnement une fois le compte Brevo créé.
      api-key: ${BREVO_API_KEY:}
      expediteur-email: ${BREVO_EXPEDITEUR_EMAIL:newsletter@thierrylacassin-auteur.fr}
      expediteur-nom: ${BREVO_EXPEDITEUR_NOM:Thierry Lacassin}
  contact:
    # Adresse de l'auteur qui reçoit les notifications du formulaire de contact.
    email-auteur: ${CONTACT_EMAIL_AUTEUR:thierry@thierrylacassin-auteur.fr}
    smtp:
      # Cf. ADR-0014 : jamais commitées, à fournir en variable d'environnement une
      # fois le SMTP réel (Gmail ou relais transactionnel) choisi et configuré.
      host: ${CONTACT_SMTP_HOST:}
      port: ${CONTACT_SMTP_PORT:587}
      username: ${CONTACT_SMTP_USERNAME:}
      password: ${CONTACT_SMTP_PASSWORD:}
      expediteur-email: ${CONTACT_SMTP_EXPEDITEUR_EMAIL:contact@thierrylacassin-auteur.fr}
      expediteur-nom: ${CONTACT_SMTP_EXPEDITEUR_NOM:Site Thierry Lacassin}

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
