spring:
  application:
    name: site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/site}
    username: ${SPRING_DATASOURCE_USERNAME:site}
    password: ${SPRING_DATASOURCE_PASSWORD:site}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      client:
        registration:
          # Identifiant fixe "keycloak" : réutilisé tel quel par SecurityConfig et
          # CompteKeycloakModelAttributeAdvice — ne pas renommer sans les mettre à
          # jour. Client confidentiel + PKCE S256 (cf. ADR-0033) : deux clients
          # Keycloak distincts existent (prod et "-local"), jamais le même en dev
          # et en prod (redirect URI localhost interdit sur le client de prod).
          # Les valeurs ci-dessous changent donc selon l'environnement qui lance
          # l'appli, pas selon un profil Spring.
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            # Doit être exactement l'un des Redirect URI valides déclarés sur le
            # client Keycloak utilisé.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Découverte OIDC (.well-known/openid-configuration) : fournit entre
            # autres l'introspection_endpoint utilisé par
            # KeycloakIntrospectionOidcUserService (jetons opaques, cf. ADR-0033) —
            # jamais l'endpoint userinfo, volontairement inutilisé.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:}

app:
  captcha:
    # Cf. ADR-0019 : reCAPTCHA v3 sur les formulaires publics (newsletter, contact,
    # avis lecteurs). site-key est publique par nature (exposee cote navigateur),
    # secret-key ne l'est pas — toutes deux jamais commises.
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    seuil-score: ${RECAPTCHA_SEUIL_SCORE:0.5}
  site:
    # Base des URL absolues du sitemap.xml (cf. ADR-0029) : un sitemap n'accepte
    # que des URL absolues. Même valeur que les autres url-base, dupliquée pour
    # rester cohérent avec le parti pris de non-couplage entre domaines.
    url-base: ${APP_URL_BASE:http://localhost:8080}
  stockage:
    images:
      chemin: ${STOCKAGE_IMAGES_CHEMIN:./data/images}
      prefixe-url: /media
  catalogue:
    # Base des URL absolues encodées dans les QR codes des fiches professionnelles
    # (cf. ADR-0028) : un QR code imprimé ne peut pas être relatif. Même valeur que
    # app.newsletter.url-base, dupliquée pour ne pas coupler les deux domaines.
    url-base: ${APP_URL_BASE:http://localhost:8080}
  newsletter:
    # Base des liens absolus (confirmation/désinscription) insérés dans les emails
    # transactionnels — un email n'a pas de "current origin" comme un navigateur.
    url-base: ${APP_URL_BASE:http://localhost:8080}
    brevo:
      # Cf. ADR-0002 / ADR-0013 : jamais commitée, à fournir en variable
      # d'environnement une fois le compte Brevo créé.
      api-key: ${BREVO_API_KEY:}
      expediteur-email: ${BREVO_EXPEDITEUR_EMAIL:newsletter@thierrylacassin-auteur.fr}
      expediteur-nom: ${BREVO_EXPEDITEUR_NOM:Thierry Lacassin}
      # Cf. ADR-0017 : identifiant de la liste de contacts Brevo à synchroniser à
      # chaque confirmation/désinscription (0 = non configurée, synchronisation
      # ignorée). À renseigner une fois la liste créée dans Brevo.
      liste-id: ${BREVO_LISTE_ID:0}
  contact:
    # Adresse de l'auteur qui reçoit les notifications du formulaire de contact.
    email-auteur: ${CONTACT_EMAIL_AUTEUR:thierry@thierrylacassin-auteur.fr}
    smtp:
      # Cf. ADR-0014 : jamais commitées, à fournir en variable d'environnement une
      # fois le SMTP réel (Gmail ou relais transactionnel) choisi et configuré.
      host: ${CONTACT_SMTP_HOST:}
      port: ${CONTACT_SMTP_PORT:587}
      username: ${CONTACT_SMTP_USERNAME:}
      password: ${CONTACT_SMTP_PASSWORD:}
      expediteur-email: ${CONTACT_SMTP_EXPEDITEUR_EMAIL:contact@thierrylacassin-auteur.fr}
      expediteur-nom: ${CONTACT_SMTP_EXPEDITEUR_NOM:Site Thierry Lacassin}

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Le mailSender du domaine contact (SmtpContactClientConfig) doit pouvoir
      # démarrer sans SMTP réel configuré (cf. ADR-0014) : désactivé explicitement
      # plutôt que de dépendre du type de retour du bean pour l'éviter.
      enabled: false
