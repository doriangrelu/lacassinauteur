spring:
  thymeleaf:
    cache: false

# Authentification back-office : Keycloak reste le royaume réel du site, mais un
# client dédié "-local" et un royaume de test (cf. ADR-0033) — jamais le client
# de prod. KEYCLOAK_ISSUER_URI/CLIENT_ID/CLIENT_SECRET à fournir en variables
# d'environnement locales (cf. .env.example), pas de valeur par défaut ici.

logging:
  level:
    fr.lacassinauteur.site: DEBUG
