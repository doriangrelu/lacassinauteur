spring:
  thymeleaf:
    cache: true

server:
  # Derrière le reverse proxy Caddy (cf. tech-stack.md) : restaure le vrai schéma/hôte
  # (X-Forwarded-*) vus par l'application — indispensable pour que Spring construise
  # une redirect_uri OAuth2 en https:// vers le bon domaine (cf. ADR-0033), pas
  # seulement pour les liens absolus applicatifs.
  forward-headers-strategy: framework

app:
  newsletter:
    url-base: ${APP_URL_BASE:https://thierrylacassin-auteur.fr}

logging:
  level:
    root: WARN
    fr.lacassinauteur.site: INFO
