<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public/layout/layout-public}">
<head>
    <title th:text="${univers.nom}">Univers</title>
    <meta name="description" th:content="${metaDescription}"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" th:content="${univers.nom}"/>
    <meta property="og:description" th:content="${metaDescription}"/>
    <meta th:if="${univers.photoUrl}" property="og:image" th:content="${univers.photoUrl}"/>
</head>
<body>
<div layout:fragment="contenu">
    <section class="relative aspect-[16/9] max-h-[60vh] w-full overflow-hidden bg-slate-900 sm:aspect-[21/9]">
        <img th:if="${univers.photoUrl}" th:src="@{${univers.photoUrl}}" th:alt="${univers.nom}" class="h-full w-full object-cover"/>
    </section>

    <section class="page-conteneur flex flex-col items-center gap-4 py-10 text-center">
        <h1 class="font-display text-3xl font-bold tracking-tight" th:text="${univers.nom}">Univers</h1>
        <p class="max-w-xl text-sm text-mist" th:text="${univers.texte}">Texte de présentation</p>
    </section>

    <section class="grid gap-1 sm:grid-cols-2">
        <div th:each="collection : ${collections}" class="flex flex-col gap-6 border-t border-black/5 px-6 py-10 md:px-10">
            <a th:href="@{'/collections/' + ${collection.slug}}" class="flex flex-col gap-1">
                <h2 class="font-display text-2xl font-bold" th:text="${collection.nom}">Collection</h2>
                <p class="font-display italic text-mist" th:text="${collection.sousTitre}">Sous-titre</p>
            </a>
            <p class="text-sm text-mist" th:text="${collection.texte}">Texte</p>
            <div class="flex gap-3 overflow-x-auto pb-2">
                <a th:each="livre : ${livresParCollection.get(collection.id)}" th:href="@{'/livres/' + ${livre.slug}}" class="shrink-0">
                    <img th:if="${livre.couvertureUrl}" th:src="@{${livre.couvertureUrl}}" th:alt="${livre.titre}" class="h-40 w-auto rounded shadow"/>
                </a>
            </div>
            <a th:href="@{'/collections/' + ${collection.slug}}" class="lien-souligne self-start">Découvrir la collection</a>
        </div>
    </section>

    <section class="page-conteneur flex flex-col items-center gap-4 py-12 text-center">
        <a th:if="${autreUnivers}" th:href="@{'/univers/' + ${autreUnivers.slug}}" class="lien-souligne">
            Découvrir l'autre univers — <span th:text="${autreUnivers.nom}">Autre univers</span>
        </a>
        <a th:href="@{/}" class="text-sm text-mist hover:text-ink">Retour à l'accueil</a>
    </section>
</div>
</body>
</html>
