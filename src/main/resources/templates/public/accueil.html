<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{public/layout/layout-public}">
<head>
    <title>Romans noirs et récits de trajectoires humaines</title>
    <meta name="description" th:content="${metaDescription}"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Thierry Lacassin — Auteur"/>
    <meta property="og:description" th:content="${metaDescription}"/>
</head>
<body>
<div layout:fragment="contenu">
    <section class="page-conteneur flex flex-col items-center gap-2 py-12 text-center">
        <h1 class="font-display text-4xl font-bold tracking-tight md:text-5xl">THIERRY LACASSIN</h1>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-mist">Auteur</p>
        <p class="font-display mt-2 text-xl italic">Deux univers. Une seule façon d'écrire.</p>
    </section>

    <section class="grid gap-1 sm:grid-cols-2">
        <a th:each="univers : ${universList}" th:href="@{'/univers/' + ${univers.slug}}"
           class="group relative block aspect-[4/5] overflow-hidden bg-slate-900">
            <img th:if="${univers.photoUrl}" th:src="@{${univers.photoUrl}}" th:alt="${univers.nom}"
                 class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"/>
            <div class="absolute inset-x-0 bottom-0 flex flex-col items-start gap-1 bg-gradient-to-t from-black/70 via-black/10 to-transparent p-6 backdrop-blur-sm md:p-10">
                <span class="font-display text-2xl font-bold text-white md:text-3xl" th:text="${univers.nom}">Univers</span>
                <span class="text-sm text-white/80 underline underline-offset-4 transition-colors group-hover:text-white">Découvrir l'univers</span>
            </div>
        </a>
    </section>

    <section th:if="${derniereParution}" class="page-conteneur flex flex-col items-center gap-6 py-16 text-center">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-mist">Dernière parution</p>
        <img th:if="${derniereParution.couvertureUrl}" th:src="@{${derniereParution.couvertureUrl}}" th:alt="${derniereParution.titre}"
             loading="lazy" class="h-72 w-auto rounded shadow-lg"/>
        <h2 class="font-display text-2xl font-bold" th:text="${derniereParution.titre}">Titre</h2>
        <p class="max-w-md text-sm text-mist" th:text="${derniereParution.pitchCourt}">Pitch</p>
        <div class="flex flex-wrap justify-center gap-6">
            <a th:href="@{'/livres/' + ${derniereParution.slug}}" class="lien-souligne">Découvrir le livre</a>
            <a th:if="${derniereParution.disponible}" th:href="${derniereParution.lienAchatUrl}" target="_blank" rel="noopener"
               class="lien-souligne" th:text="'Acheter sur ' + ${derniereParution.lienAchatLibelle}">Acheter</a>
        </div>
    </section>
</div>
</body>
</html>
