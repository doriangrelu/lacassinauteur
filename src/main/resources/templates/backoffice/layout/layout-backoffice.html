<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE — Back-office Thierry Lacassin">Back-office</title>
    <link rel="stylesheet" th:href="@{/css/backoffice.css}"/>
    <script src="/js/modales.js" defer></script>
    <script src="/js/reordonner.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 md:flex">
<div th:replace="~{backoffice/fragments/sidebar :: sidebar}"></div>
<div class="flex min-h-screen flex-1 flex-col">
    <div th:replace="~{backoffice/fragments/topbar :: topbar(emailConnecte=${emailConnecte})}"></div>
    <p th:if="${erreurFichier}" th:text="${erreurFichier}"
       class="mx-4 mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 md:mx-10"></p>
    <!-- Le Thymeleaf Layout Dialect remplace entièrement cette balise (et ses
         classes) par l'élément layout:fragment="contenu" de la page décorée : le
         padding/la largeur max vivent donc dans la classe .page-conteneur
         (frontend/backoffice.css), à poser sur l'élément racine de chaque page,
         pas ici. -->
    <main layout:fragment="contenu"></main>
</div>
</body>
</html>
