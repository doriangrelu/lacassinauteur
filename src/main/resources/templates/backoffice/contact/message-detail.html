<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/layout-backoffice}">
<head>
    <title>Message de contact</title>
</head>
<body>
<section layout:fragment="contenu" class="page-conteneur flex flex-col gap-6">
    <a th:href="@{/backoffice/messages}" class="link-action self-start text-slate-600 hover:text-slate-900">
        <span th:replace="~{backoffice/fragments/icons :: arrowUturnLeft('h-4 w-4')}"></span>
        Retour aux messages
    </a>

    <div class="card max-w-xl p-6">
        <div class="mb-5 flex items-start justify-between gap-4">
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-900" th:text="${message.objet}">Objet</h1>
                <p class="mt-1 text-sm text-slate-500" th:text="${#temporals.format(message.dateReception, 'dd/MM/yyyy HH:mm')}">Date</p>
            </div>
            <span th:if="${message.statut.name() == 'NOUVEAU'}" class="badge badge-role">Nouveau</span>
            <span th:if="${message.statut.name() == 'LU'}" class="badge badge-inactif">Lu</span>
            <span th:if="${message.statut.name() == 'TRAITE'}" class="badge badge-actif">Traité</span>
        </div>

        <dl class="mb-5 grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-sm">
            <dt class="text-slate-500">De</dt>
            <dd class="text-slate-900" th:text="${message.nom}">Nom</dd>
            <dt class="text-slate-500">Email</dt>
            <dd class="text-slate-900">
                <a th:href="'mailto:' + ${message.email}" class="link-action text-indigo-600 hover:text-indigo-700" th:text="${message.email}">email@exemple.fr</a>
            </dd>
        </dl>

        <p class="mb-6 whitespace-pre-wrap text-sm text-slate-700" th:text="${message.message}">Message</p>

        <form th:if="${message.statut.name() != 'TRAITE'}" th:action="@{'/backoffice/messages/' + ${message.id} + '/traiter'}" method="post">
            <button type="submit" class="btn btn-primary">
                <span th:replace="~{backoffice/fragments/icons :: checkCircle('h-4 w-4')}"></span>
                Marquer traité
            </button>
        </form>
    </div>
</section>
</body>
</html>
