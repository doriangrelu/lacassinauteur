<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- "md:min-h-screen" et non "md:h-screen" : le body est un conteneur flex, donc
     la barre s'étire naturellement à la hauteur du contenu (align-items: stretch).
     Une hauteur fixe de 100vh l'empêchait de s'étirer et laissait apparaître le
     fond gris de la page sous la barre dès que le contenu dépassait l'écran. -->
<nav th:fragment="sidebar"
     class="w-full shrink-0 border-b border-slate-200 bg-white p-4 md:min-h-screen md:w-60 md:border-b-0 md:border-r md:p-6">
    <div class="mb-6 flex items-center gap-2 px-1">
        <span th:replace="~{backoffice/fragments/icons :: bookOpen('h-6 w-6 text-indigo-600')}"></span>
        <span class="font-semibold tracking-tight text-slate-900">Thierry Lacassin</span>
    </div>
    <ul class="flex flex-wrap gap-1 md:flex-col">
        <li>
            <a th:href="@{/backoffice/auteur}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: userCircle('h-5 w-5')}"></span>
                Page auteur
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/univers}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: globeAlt('h-5 w-5')}"></span>
                Univers
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/collections}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: rectangleStack('h-5 w-5')}"></span>
                Collections
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/livres}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: bookOpen('h-5 w-5')}"></span>
                Livres
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/avis}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: star('h-5 w-5')}"></span>
                Avis lecteurs
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/actualites}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: calendar('h-5 w-5')}"></span>
                Actualités
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/abonnes}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: envelope('h-5 w-5')}"></span>
                Abonnés
            </a>
        </li>
        <!-- Raccourci vers Brevo : les campagnes sont composées et envoyées
             directement là-bas (cf. ADR-0017), pas dans ce back-office. Marqué
             comme lien externe (flèche + nouvel onglet) pour que la sortie du
             site soit explicite. -->
        <li>
            <a href="https://app.brevo.com/" target="_blank" rel="noopener"
               class="nav-lien" title="Composer et envoyer une newsletter sur Brevo (site externe)">
                <span th:replace="~{backoffice/fragments/icons :: pencilSquare('h-5 w-5')}"></span>
                Newsletters
                <span aria-hidden="true" class="ml-auto text-xs text-slate-400">↗</span>
            </a>
        </li>
        <li>
            <a th:href="@{/backoffice/messages}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: chatBubble('h-5 w-5')}"></span>
                Messages
            </a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/backoffice/comptes}" class="nav-lien">
                <span th:replace="~{backoffice/fragments/icons :: users('h-5 w-5')}"></span>
                Comptes
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
