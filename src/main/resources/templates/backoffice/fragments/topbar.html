<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar"
        class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 md:px-10">
    <div class="flex items-center gap-2 text-sm text-slate-600">
        <span th:replace="~{backoffice/fragments/icons :: userCircle('h-5 w-5 text-slate-400')}"></span>
        <span sec:authentication="principal.email">utilisateur@example.com</span>
    </div>
    <div class="flex items-center gap-2">
        <a th:href="${urlCompteKeycloak}" class="btn btn-ghost">
            <span th:replace="~{backoffice/fragments/icons :: userCircle('h-4 w-4')}"></span>
            Mon compte
        </a>
        <form th:action="@{/backoffice/deconnexion}" method="post">
            <button type="submit" class="btn btn-ghost">
                <span th:replace="~{backoffice/fragments/icons :: logout('h-4 w-4')}"></span>
                Se déconnecter
            </button>
        </form>
    </div>
</header>
</body>
</html>
