<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/layout-backoffice}">
<head>
    <title>Comptes</title>
</head>
<body>
<section layout:fragment="contenu" class="page-conteneur flex flex-col gap-8">
    <header class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Comptes back-office</h1>
            <p class="mt-1 text-sm text-slate-500">Gère les accès des administrateurs et de l'auteur.</p>
        </div>
        <button type="button" class="btn btn-primary" data-ouvrir-modale="modale-creer-compte">
            <span th:replace="~{backoffice/fragments/icons :: plus('h-4 w-4')}"></span>
            Ajouter un compte
        </button>
    </header>

    <div class="card overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-xs font-medium uppercase tracking-wide text-slate-500">
            <tr>
                <th class="px-6 py-3">Email</th>
                <th class="px-6 py-3">Rôle</th>
                <th class="px-6 py-3">Statut</th>
                <th class="px-6 py-3">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="compte : ${comptes}" class="hover:bg-slate-50">
                <td class="px-6 py-4 font-medium text-slate-900" th:text="${compte.email}">utilisateur@example.com</td>
                <td class="px-6 py-4">
                    <span class="badge badge-role" th:text="${compte.role}">ADMIN</span>
                </td>
                <td class="px-6 py-4">
                    <span th:if="${compte.actif}" class="badge badge-actif">Actif</span>
                    <span th:unless="${compte.actif}" class="badge badge-inactif">Désactivé</span>
                </td>
                <td class="px-6 py-4">
                    <div class="flex flex-wrap items-center gap-4">
                        <form th:action="@{'/backoffice/comptes/' + ${compte.id} + '/role'}" method="post" class="flex items-center gap-2">
                            <select name="role" class="champ-select py-1 text-xs">
                                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                                        th:selected="${role.name()} == ${compte.role}"></option>
                            </select>
                            <button type="submit" class="link-action text-slate-600 hover:text-slate-900">
                                <span th:replace="~{backoffice/fragments/icons :: pencilSquare('h-4 w-4')}"></span>
                                Changer
                            </button>
                        </form>
                        <form th:if="${compte.actif}" th:action="@{'/backoffice/comptes/' + ${compte.id} + '/desactiver'}" method="post">
                            <button type="submit" class="link-action text-red-600 hover:text-red-700">
                                <span th:replace="~{backoffice/fragments/icons :: noSymbol('h-4 w-4')}"></span>
                                Désactiver
                            </button>
                        </form>
                        <form th:unless="${compte.actif}" th:action="@{'/backoffice/comptes/' + ${compte.id} + '/reactiver'}" method="post">
                            <button type="submit" class="link-action text-emerald-600 hover:text-emerald-700">
                                <span th:replace="~{backoffice/fragments/icons :: checkCircle('h-4 w-4')}"></span>
                                Réactiver
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <dialog id="modale-creer-compte" class="modale" th:object="${formulaire}"
            th:attr="open=${#fields.hasErrors('*')} ? 'open' : null">
        <div class="modale-entete">
            <div class="flex items-center gap-2">
                <span th:replace="~{backoffice/fragments/icons :: userPlus('h-5 w-5 text-indigo-600')}"></span>
                <h2 class="text-lg font-semibold tracking-tight text-slate-900">Créer un compte</h2>
            </div>
            <button type="button" class="btn-ghost rounded-lg p-1.5" data-fermer-modale aria-label="Fermer">
                <span th:replace="~{backoffice/fragments/icons :: xMark('h-5 w-5')}"></span>
            </button>
        </div>

        <form th:action="@{/backoffice/comptes}" method="post" class="modale-corps">
            <div>
                <label class="champ-label" for="email">Email</label>
                <div class="champ-avec-icone">
                    <span th:replace="~{backoffice/fragments/icons :: envelope('h-5 w-5')}"></span>
                    <input class="champ-texte" type="email" id="email" th:field="*{email}"/>
                </div>
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="champ-erreur"></p>
            </div>

            <div>
                <label class="champ-label" for="motDePasse">Mot de passe</label>
                <div class="champ-avec-icone">
                    <span th:replace="~{backoffice/fragments/icons :: lockClosed('h-5 w-5')}"></span>
                    <input class="champ-texte" type="password" id="motDePasse" th:field="*{motDePasse}"/>
                </div>
                <p th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}" class="champ-erreur"></p>
            </div>

            <div>
                <label class="champ-label" for="role">Rôle</label>
                <select id="role" th:field="*{role}" class="champ-select">
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary mt-1">
                <span th:replace="~{backoffice/fragments/icons :: userPlus('h-4 w-4')}"></span>
                Créer le compte
            </button>
        </form>
    </dialog>
</section>
</body>
</html>
