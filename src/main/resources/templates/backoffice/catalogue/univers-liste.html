<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/layout-backoffice}">
<head>
    <title>Univers</title>
</head>
<body>
<section layout:fragment="contenu" class="page-conteneur flex flex-col gap-8">
    <header>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Univers</h1>
        <p class="mt-1 text-sm text-slate-500">Les grands ensembles littéraires de Thierry Lacassin.</p>
    </header>

    <div class="card overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-xs font-medium uppercase tracking-wide text-slate-500">
            <tr>
                <th class="px-6 py-3">Ordre</th>
                <th class="px-6 py-3">Nom</th>
                <th class="px-6 py-3">Sous-titre</th>
                <th class="px-6 py-3">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="univers : ${universList}" class="hover:bg-slate-50">
                <td class="px-6 py-4 text-slate-500" th:text="${univers.ordre}">0</td>
                <td class="px-6 py-4 font-medium text-slate-900" th:text="${univers.nom}">Nom</td>
                <td class="px-6 py-4 text-slate-500" th:text="${univers.sousTitre}">Sous-titre</td>
                <td class="px-6 py-4">
                    <a th:href="@{'/backoffice/univers/' + ${univers.id} + '/modifier'}" class="link-action text-slate-600 hover:text-slate-900">
                        <span th:replace="~{backoffice/fragments/icons :: pencilSquare('h-4 w-4')}"></span>
                        Modifier
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(universList)}">
                <td colspan="4" class="px-6 py-8 text-center text-slate-400">Aucun univers pour l'instant.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card max-w-lg p-6">
        <div class="mb-5 flex items-center gap-2">
            <span th:replace="~{backoffice/fragments/icons :: globeAlt('h-5 w-5 text-indigo-600')}"></span>
            <h2 class="text-lg font-semibold tracking-tight text-slate-900">Créer un univers</h2>
        </div>

        <form th:action="@{/backoffice/univers}" th:object="${formulaire}" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
            <div>
                <label class="champ-label" for="nom">Nom</label>
                <input class="champ-texte" type="text" id="nom" th:field="*{nom}"/>
                <p th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="champ-erreur"></p>
            </div>
            <div>
                <label class="champ-label" for="sousTitre">Sous-titre / accroche</label>
                <input class="champ-texte" type="text" id="sousTitre" th:field="*{sousTitre}"/>
            </div>
            <div>
                <label class="champ-label" for="texte">Texte de présentation</label>
                <textarea class="champ-texte" id="texte" rows="4" th:field="*{texte}"></textarea>
            </div>
            <div>
                <label class="champ-label" for="photo">Photo</label>
                <input class="champ-texte" type="file" id="photo" th:field="*{photo}" accept="image/*"/>
            </div>
            <div>
                <label class="champ-label" for="ordre">Ordre d'affichage</label>
                <input class="champ-texte" type="number" id="ordre" th:field="*{ordre}"/>
            </div>
            <button type="submit" class="btn btn-primary mt-1">
                <span th:replace="~{backoffice/fragments/icons :: globeAlt('h-4 w-4')}"></span>
                Créer l'univers
            </button>
        </form>
    </div>
</section>
</body>
</html>
