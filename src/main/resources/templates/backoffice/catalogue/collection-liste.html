<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/layout-backoffice}">
<head>
    <title>Collections</title>
</head>
<body>
<section layout:fragment="contenu" class="page-conteneur flex flex-col gap-8">
    <header class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Collections</h1>
            <p class="mt-1 text-sm text-slate-500">Les collections regroupent les livres à l'intérieur d'un univers.</p>
        </div>
        <button type="button" class="btn btn-primary" data-ouvrir-modale="modale-creer-collection">
            <span th:replace="~{backoffice/fragments/icons :: plus('h-4 w-4')}"></span>
            Ajouter une collection
        </button>
    </header>

    <p class="text-xs text-slate-400">Glissez-déposez une ligne pour changer l'ordre d'affichage.</p>

    <div class="card overflow-x-auto">
        <table class="w-full text-left text-sm" data-formulaire-reordonner="formulaire-reordonner-collection">
            <thead class="bg-slate-50 text-xs font-medium uppercase tracking-wide text-slate-500">
            <tr>
                <th class="px-6 py-3 w-10"></th>
                <th class="px-6 py-3">Nom</th>
                <th class="px-6 py-3">Univers</th>
                <th class="px-6 py-3">Sous-titre</th>
                <th class="px-6 py-3">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="collection : ${collections}" th:data-id="${collection.id}" draggable="true" class="hover:bg-slate-50 cursor-move">
                <td class="px-6 py-4 text-slate-400">
                    <span th:replace="~{backoffice/fragments/icons :: bars3('h-4 w-4')}"></span>
                </td>
                <td class="px-6 py-4 font-medium text-slate-900" th:text="${collection.nom}">Nom</td>
                <td class="px-6 py-4">
                    <span class="badge badge-role" th:text="${collection.universNom}">Univers</span>
                </td>
                <td class="px-6 py-4 text-slate-500" th:text="${collection.sousTitre}">Sous-titre</td>
                <td class="px-6 py-4">
                    <a th:href="@{'/backoffice/collections/' + ${collection.id} + '/modifier'}" class="link-action text-slate-600 hover:text-slate-900">
                        <span th:replace="~{backoffice/fragments/icons :: pencilSquare('h-4 w-4')}"></span>
                        Modifier
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(collections)}">
                <td colspan="5" class="px-6 py-8 text-center text-slate-400">Aucune collection pour l'instant.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <form id="formulaire-reordonner-collection" th:action="@{/backoffice/collections/reordonner}" method="post" class="hidden"></form>

    <dialog id="modale-creer-collection" class="modale" th:object="${formulaire}"
            th:attr="open=${#fields.hasErrors('*')} ? 'open' : null">
        <div class="modale-entete">
            <div class="flex items-center gap-2">
                <span th:replace="~{backoffice/fragments/icons :: rectangleStack('h-5 w-5 text-indigo-600')}"></span>
                <h2 class="text-lg font-semibold tracking-tight text-slate-900">Créer une collection</h2>
            </div>
            <button type="button" class="btn-ghost rounded-lg p-1.5" data-fermer-modale aria-label="Fermer">
                <span th:replace="~{backoffice/fragments/icons :: xMark('h-5 w-5')}"></span>
            </button>
        </div>

        <form th:action="@{/backoffice/collections}" method="post" class="modale-corps">
            <div>
                <label class="champ-label" for="universId">Univers</label>
                <select class="champ-select" id="universId" th:field="*{universId}">
                    <option th:each="univers : ${universList}" th:value="${univers.id}" th:text="${univers.nom}"></option>
                </select>
            </div>
            <div>
                <label class="champ-label" for="nom">Nom</label>
                <input class="champ-texte" type="text" id="nom" th:field="*{nom}"/>
                <p th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="champ-erreur"></p>
            </div>
            <div>
                <label class="champ-label" for="sousTitre">Sous-titre</label>
                <input class="champ-texte" type="text" id="sousTitre" th:field="*{sousTitre}"/>
            </div>
            <div>
                <label class="champ-label" for="texte">Texte de présentation</label>
                <textarea class="champ-texte" id="texte" rows="4" th:field="*{texte}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-1">
                <span th:replace="~{backoffice/fragments/icons :: rectangleStack('h-4 w-4')}"></span>
                Créer la collection
            </button>
        </form>
    </dialog>
</section>
</body>
</html>
